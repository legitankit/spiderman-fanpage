<!DOCTYPE html>
<html>

<head>
    <title>Linear Gradient Example</title>

    <style>
        body {
            margin: 0;
            background: #050505;
        }

        .box {

            width: 500px;
            height:80vh;

            margin: 50px auto;

            background:
                linear-gradient(to right, red 1px, transparent 1px calc(100% - 1px), red calc(100% - 1px) ),
                linear-gradient(to bottom, red 1px, transparent 1px calc(100% - 1px), red calc(100% - 1px) );

            background-size: 50px 50px,50px 50px;
            background-repeat: repeat;
        }
    </style>
</head>

<body>

    <div class="box"></div>

</body>

</html>
