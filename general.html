<!DOCTYPE html>
<html lang="en">

<head>
    <title>Spider-Man FanPage</title>

    <!-- Primary SEO -->
    <meta name="keywords"
        content="Spider-Man, Spider-Man Universe, Spider-Man Characters, Spider-Man Powers, Spider-Man Web Shooter, Spider-Man Movies, Spider-Man Animation, Spider-Man Marvel, Peter Parker, Miles Morales, Spider-Verse, Marvel Superhero, Spider-Man Web Effects, Spider-Man Fan Art, Spider-Man Villains, Spider-Man Heroes">

        content="A complete journey through the Spider-Man universe, from classic stories to modern Spider-Verse adventures. Explore iconic characters, powerful abilities, web-slinging action, and the cinematic world of Spider-Man.">
    <meta name="author" content="AnkitRaj-[AS]">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- site logo-link (Ye browser tab ke chhote icon ke liye hai)-->
    <link rel="icon" type="image/png" href="../gallery/spidylogo.png">

    <!-- JSON-LD -->
    <!-- JSON-LD ka logo browser mein directly display nahi hota. Ye search engines ko publisher ke logo ke baare mein information deta hai.-->

    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Spider-Man Tour",
  "url": "https://yourlivewebsitelink.com/",
  "description": "Explore the complete Spider-Man universe with classic stories, Spider-Verse, and modern cinematic adventures.",
  "publisher": {
    "@type": "Person",
    "name": "Ankit Raj",
    "logo": {
      "@type": "ImageObject",
      "url": "https://yourlivewebsitelink.com/images/spiderman-logo.png"
    }
  }
}


</script>

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <!-- site link -->
    <link rel="canonical" href="https://yourlivewebsitelink.com/">
    <meta property="og:url" content="https://yourlivewebsitelink.com/">

    <meta property="og:title" content="Spider-Man Universe | Spider-Verse, Characters & Web Adventures">

    <meta property="og:description"
        content="A journey through the Spider-Man universe. Explore Spider-Verse, iconic heroes, powerful villains, and cinematic web-slinging adventures.">

    <!-- og img link -->
    <meta property="og:image" content="https://yourlivewebsitelink.com/images/spiderman-og.jpg">

    <meta property="og:image:alt" content="Spider-Man with web effects and iconic characters from the Spider-Verse">

    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:site_name" content="Spider-Man Tour">
    <meta property="og:locale" content="en_US">

    <meta name="twitter:image:alt" content="Spider-Man cinematic web animation with Spider-Verse characters">
